    <script>
      (function () {
        try {
          var ownDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          var proto = Object.getPrototypeOf(window);
          var protoDesc = proto ? Object.getOwnPropertyDescriptor(proto, 'fetch') : undefined;
          var desc = ownDesc || protoDesc;
          if (desc && !(desc.writable || typeof desc.set === 'function') && (!ownDesc || ownDesc.configurable)) {
            var overrideFetch = null;
            var baseGetter =
              typeof desc.get === 'function'
                ? function () {
                    return desc.get.call(window);
                  }
                : function () {
                    return desc.value;
                  };
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: desc.enumerable !== false,
              get: function () {
                return overrideFetch !== null ? overrideFetch : baseGetter();
              },
              set: function (next) {
                if (typeof next === 'function') {
                  overrideFetch = next;
                }
              },
            });
          }
        } catch (_) {}

        window.addEventListener(
          'error',
          function (event) {
            var src = String((event && event.filename) || '');
            var msg = String((event && event.message) || '');
            if (
              src.indexOf('chrome-extension://') === 0 ||
              src.indexOf('moz-extension://') === 0 ||
              src.indexOf('safari-web-extension://') === 0 ||
              msg.indexOf('Cannot set property fetch of #<Window>') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
